<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SPPU SE Computer Engineering — Master Exam Prep Studio (2024 Pattern)</title>
  <meta name="theme-color" content="#F8F9FB" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="manifest" href="assets/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar-shell">
    <div class="topbar">
      <button class="brand" data-action="go-tab" data-tab="home" type="button">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="9.5" y="2.5" width="5" height="5" rx="1" transform="rotate(45 12 5)" />
            <rect x="16.5" y="9.5" width="5" height="5" rx="1" transform="rotate(45 19 12)" />
            <rect x="9.5" y="16.5" width="5" height="5" rx="1" transform="rotate(45 12 19)" />
            <rect x="2.5" y="9.5" width="5" height="5" rx="1" transform="rotate(45 5 12)" />
          </svg>
        </span>
        <span>
          <span class="brand-title">Exam Studio</span>
          <span class="brand-sub">SPPU Sem III</span>
        </span>
      </button>

      <nav class="desktop-nav" aria-label="Primary laptop navigation">
        <button class="desktop-nav-btn active" data-action="go-tab" data-tab="home" type="button">Home</button>
        <button class="desktop-nav-btn" data-action="go-tab" data-tab="subjects" type="button">Subjects</button>
        <button class="desktop-nav-btn" data-action="go-tab" data-tab="timetable" type="button">Timetable</button>
        <button class="desktop-nav-btn" data-action="go-tab" data-tab="pyqs" type="button">PDFs</button>
        <button class="desktop-nav-btn" data-action="go-tab" data-tab="insights" type="button">Insights</button>
      </nav>

      <div class="topbar-actions">
        <button class="search-trigger-btn" data-action="open-search" type="button" title="Search topics, formulas, PDFs (Ctrl+K)" aria-label="Search topics and papers">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <span class="search-trigger-label">Search...</span>
          <kbd class="search-kbd">Ctrl K</kbd>
        </button>

        <button class="icon-circle-btn" data-action="open-timer" type="button" title="Study Focus Timer" aria-label="Study Focus Timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8" />
            <polyline points="12 9 12 13 14.5 14.5" />
            <line x1="9" y1="2" x2="15" y2="2" />
          </svg>
        </button>

        <button id="topbar-theme-btn" class="theme-pill-btn" data-action="cycle-theme" type="button" title="Switch theme (Light / Warm / Dark)" aria-label="Switch theme">
          <span id="topbar-theme-icon" aria-hidden="true"></span>
          <span id="topbar-theme-label" class="theme-pill-label">Light</span>
        </button>

        <button class="user-pill-btn" data-action="open-users" type="button" title="Switch or create student profile">
          <span id="topbar-avatar" class="user-avatar-dot">S</span>
          <span id="topbar-username" class="user-pill-name">Student</span>
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <main id="app-main" aria-live="polite"></main>
  </div>

  <!-- Mobile / Tablet Floating Frosted Glass Pill Navigation (< 900px) -->
  <nav class="floating-nav-wrap" aria-label="Mobile navigation">
    <div class="floating-nav">
      <button class="nav-tab active" data-action="go-tab" data-tab="home" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z" />
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-tab" data-action="go-tab" data-tab="subjects" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" />
        </svg>
        <span>Subjects</span>
      </button>
      <button class="nav-tab" data-action="go-tab" data-tab="timetable" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="3" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        <span>Timetable</span>
      </button>
      <button class="nav-tab" data-action="go-tab" data-tab="pyqs" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="8" y1="13" x2="16" y2="13" />
          <line x1="8" y1="17" x2="13" y2="17" />
        </svg>
        <span>PDFs</span>
      </button>
      <button class="nav-tab" data-action="go-tab" data-tab="insights" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V9" />
          <path d="M10 19V5" />
          <path d="M16 19v-7" />
          <path d="M21 19v-4" />
        </svg>
        <span>Insights</span>
      </button>
    </div>
  </nav>

  <!-- User Switcher Modal -->
  <div id="users-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="users-modal-title">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="users-modal-title" class="modal-title">Student Profiles (Local)</h2>
        <button class="icon-circle-btn" data-action="close-modal" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="users-modal-body"></div>
    </div>
  </div>

  <!-- Global Search Modal -->
  <div id="search-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="search-modal-title" class="modal-title">Search Syllabus, Formulas &amp; PDFs</h2>
        <button class="icon-circle-btn" data-action="close-modal" type="button" aria-label="Close">&times;</button>
      </div>
      <input id="global-search-input" class="input-pill" type="search" placeholder="Search 193 topics, formulas, or 112 PDFs..." />
      <div id="global-search-results" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- Focus Timer Modal -->
  <div id="timer-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="timer-modal-title">
    <div class="modal-sheet" style="text-align:center;">
      <div class="modal-head">
        <h2 id="timer-modal-title" class="modal-title">Study Focus Timer</h2>
        <button class="icon-circle-btn" data-action="close-modal" type="button" aria-label="Close">&times;</button>
      </div>
      <div style="margin-bottom:14px;">
        <select id="timer-subject-sel" class="input-pill" aria-label="Subject for timer"></select>
      </div>
      <div id="timer-display" class="big-kpi" style="font-size:3.5rem;margin:12px 0;">25:00</div>
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="filter-chip" data-action="timer-preset" data-mins="15" type="button">15m Sprint</button>
        <button class="filter-chip" data-action="timer-preset" data-mins="25" type="button">25m Pomodoro</button>
        <button class="filter-chip" data-action="timer-preset" data-mins="50" type="button">50m Deep</button>
      </div>
      <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
        <button id="timer-start-btn" class="btn-primary" data-action="timer-toggle" type="button">Start</button>
        <button class="btn-secondary" data-action="timer-reset" type="button">Reset</button>
        <button class="btn-secondary" data-action="timer-log-now" type="button">Log Elapsed</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="assets/study-data.js"></script>
  <script src="assets/app-store.js"></script>
  <script src="assets/portal.js"></script>
</body>
</html>
